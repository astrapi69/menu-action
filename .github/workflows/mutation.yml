# Runs mutation testing with pitest on a weekly schedule and on demand. Uploads the html
# report as a workflow artifact. This does not gate merges, it surfaces weak tests.

name: Mutation Testing

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  pitest:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run pitest
        run: ./gradlew pitest
      - name: Upload the mutation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-report
          path: build/reports/pitest
          retention-days: 30
