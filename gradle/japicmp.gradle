import org.gradle.api.artifacts.component.ModuleComponentIdentifier

/**
 * The binary compatibility gate: the jar of this build against the last published release of this
 * artifact on Maven Central, by japicmp.
 *
 * Semantic versioning decides whether a binary incompatible change is an error. With the same major
 * version as the release it fails the build, because a minor or patch release must not break a
 * caller compiled against the release before; 5.1 did exactly that (the Known issues of 5.1 in
 * CHANGELOG.md: ActionRegistry() became private, the all-arguments constructors of MenuInfo and
 * MenuItemInfo changed their descriptor) and nothing said so. With a higher major it is written to
 * the report and the build goes on, because a major is where breaking changes belong. A lower major
 * than the last release (a hotfix of an older line) refuses to compare, since the last release is
 * not the baseline of that line.
 *
 * The family's other gates (crypt-data, crypt-api) run the japicmp core through JavaExec against a
 * baseline version kept in gradle.properties; this one uses the Gradle plugin and resolves the
 * baseline as latest.release, so no property has to move with a release.
 */
def baselineGroup = "$groupPackage".toString()
def baselineModule = "$rootProject.name".toString()
def baselineNotation = "${baselineGroup}:${baselineModule}:latest.release".toString()

// A detached configuration: in a configuration of this project Gradle answered the project's own
// coordinates with the project itself (measured 2026-11-18, the guard below refused it), so the
// baseline would have been the jar under test
def japicmpBaseline = configurations.detachedConfiguration(dependencies.create(baselineNotation))
japicmpBaseline.transitive = false

// Only Maven Central answers for this artifact: never mavenLocal, where a local publishToMavenLocal
// would stand in for the release, nor the snapshot repository. No other configuration depends on
// the artifact itself, so the exclusion touches nothing else
repositories.configureEach { repository ->
    if (repository.name != ArtifactRepositoryContainer.DEFAULT_MAVEN_CENTRAL_REPO_NAME) {
        repository.content { excludeModule(baselineGroup, baselineModule) }
    }
}

def majorOf = { String version -> Integer.parseInt(version.tokenize('.-')[0]) }
// plain values, so that the provider below holds no reference to the project (configuration cache)
def thisVersion = "$projectVersion".toString()
def projectMajor = majorOf(thisVersion)

/**
 * The version of the release the baseline resolved to. Fails closed: anything but exactly one
 * module from a repository (for instance this project itself, which Gradle can answer for its own
 * coordinates) would compare the jar with itself and report green.
 */
def baselineVersion = japicmpBaseline.incoming.artifacts.resolvedArtifacts.map { artifacts ->
    def ids = artifacts.collect { it.id.componentIdentifier }
    if (ids.size() != 1 || !(ids[0] instanceof ModuleComponentIdentifier)) {
        throw new GradleException("japicmp: the baseline ${baselineNotation} resolved to ${ids}, " +
            "not to one release from Maven Central - refusing to compare")
    }
    def version = ((ModuleComponentIdentifier) ids[0]).version
    if (projectMajor < majorOf(version)) {
        throw new GradleException("japicmp: projectVersion ${thisVersion} has a lower major than the " +
            "last release ${version}, which is not the baseline of this line - refusing to compare")
    }
    version
}

// The plugin is applied in build.gradle through the version catalog; a script applied with
// 'apply from' does not see the classes of that plugin, so the task type comes from its class loader
def japicmpTaskType = plugins.getPlugin('me.champeau.gradle.japicmp').class.classLoader
    .loadClass('me.champeau.gradle.japicmp.JapicmpTask')

tasks.register('japicmp', japicmpTaskType) {
    group = 'verification'
    description = 'Compares the jar with the last release on Maven Central; a binary incompatible change fails within the same major'
    oldClasspath.from(japicmpBaseline)
    newClasspath.from(tasks.named('jar'))
    onlyBinaryIncompatibleModified = true
    // the baseline comes without its dependencies (model-data, lombok), whose classes it references
    ignoreMissingClasses = true
    failOnModification = baselineVersion.map { projectMajor == majorOf(it) }
    htmlOutputFile = layout.buildDirectory.file('reports/japicmp/japicmp.html')
    txtOutputFile = layout.buildDirectory.file('reports/japicmp/japicmp.txt')
    def failing = failOnModification
    doFirst { task ->
        task.logger.lifecycle("japicmp: ${thisVersion} against release ${baselineVersion.get()} - " +
            (failing.get() ? 'the same major, a binary incompatible change fails the build'
                           : 'a higher major, binary incompatible changes are reported, not refused'))
    }
}

tasks.named('check') {
    dependsOn 'japicmp'
}
