[versions]
gradle-plugin-lombok-version = "9.5.0"
gradle-plugin-pitest-version = "1.19.0"
gradle-plugin-spotless-version = "8.10.0"
gradle-plugin-version-catalog-update-version = "1.1.1"
gradle-plugin-versions-version = "0.61.0"
junit-jupiter-version = "6.1.3"
junit-platform-launcher-version = "6.1.3"
lombok-version = "1.18.46"
model-data-version = "3.2.1"
pitest-junit5-plugin-version = "1.2.3"
pitest-core-version = "1.25.9"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter-version" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher-version" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok-version" }
model-data = { module = "io.github.astrapi69:model-data", version.ref = "model-data-version" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-plugin-version" }

[bundles]
# Dependencies for the annotation processor used during the compilation process
annotation-processor = [
    "lombok",
]
# Dependencies required only at compile-time and not included in the final artifact
compile-only = [
    "lombok",
]
# Bundle of the core dependencies used across the project
core-dependencies = [
    "model-data",
]
# Annotation processor dependencies used specifically for test classes
test-annotation-processor = [
    "lombok",
]
# Dependencies required only at test compile-time and not included in test runtime
test-compile-only = [
    "lombok",
]
# Dependencies required only at test runtime, such as test execution platforms
test-runtime-only = [
    "junit-platform-launcher",
]
# Dependencies required for unit testing, including assertions, mocking, and parameterized tests
unit-testing = [
    "junit-jupiter",
]

[plugins]
gradle-versions-plugin = { id = "io.github.ben-manes.versions", version.ref = "gradle-plugin-versions-version" }
lombok-plugin = { id = "io.freefair.lombok", version.ref = "gradle-plugin-lombok-version" }
pitest-plugin = { id = "info.solidsoft.pitest", version.ref = "gradle-plugin-pitest-version" }
spotless-plugin-gradle = { id = "com.diffplug.spotless", version.ref = "gradle-plugin-spotless-version" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "gradle-plugin-version-catalog-update-version" }
